# xt.yaml — lệnh chuẩn của dự án cho agent và hook (YAML PHẲNG `task: lệnh`, do .xtemplates/scripts/dev-task.sh đọc).
# Agent KHÔNG suy diễn lệnh từ văn xuôi; đọc file này. Để trống "" = không có; thiếu khoá = tự dò.
# Khi autopilot đang chạy, lint/test để "" hoặc lệnh không kiểm gì (true, :, exit 0, echo …) = cổng ĐỎ (ADR-0011).
# Nhà của bộ khoá: LOOP-HARNESS-008 (.xtemplates/framework/11-autonomous-loop/harness-files.md). dev-task CHỈ chạy format · lint · typecheck · test · build · format_file
# (`gate` = build → typecheck → lint → test). Khoá khác (install, dev, e2e, …) là lệnh KHAI BÁO để agent ĐỌC và chạy trực tiếp.
#
# NGUỒN: lệnh dưới đây là BẢN SAO của `.claude/project-commands.sh` (cổng thật của repo, cũng là cái CI chạy qua
# `bash scripts/dev-task.sh gate` — .github/workflows/ci.yml). `scripts/dev-task.sh` của repo đọc project-commands.sh,
# còn `.xtemplates/scripts/dev-task.sh` của khung đọc file này: đổi lệnh thì SỬA CẢ HAI cho khớp.
# Stack: Flutter 3.47.7 (ghim trong CI, ADR-0002), app ở apps/mobile; không có package.json/pyproject ở gốc.
lint: "python3 scripts/check-adoption.py --lint && cd apps/mobile && dart format --output=none --set-exit-if-changed lib test tool"
typecheck: "cd apps/mobile && flutter analyze --fatal-infos"
test: "python3 scripts/check-adoption.py && python3 scripts/check-release-manifest.py --self-test && bash scripts/test-hooks-gate.sh && bash scripts/test-hooks-gate-guard.sh && bash scripts/test-dev-task-gate-lock.sh && bash scripts/check-xt-yaml-sync.sh && python3 .xtemplates/scripts/xt.py progress-check PROGRESS.md && python3 scripts/test-repo-checks.py && bash scripts/check-repo-tree.sh && python3 scripts/check-links.py && python3 scripts/check-architecture.py && python3 scripts/check-test-assertions.py && python3 scripts/check-licenses.py && cd apps/mobile && TZ=UTC LANG=C.UTF-8 LC_ALL=C.UTF-8 flutter test --branch-coverage && python3 ../../scripts/check-coverage.py --lcov coverage/lcov.info --baseline coverage-baseline.json && (cd android && ./gradlew -q :app:testDebugUnitTest --rerun)"
build: "rm -f apps/mobile/build/app/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml && (cd apps/mobile && flutter pub get --enforce-lockfile && flutter build apk --debug && cd android && ./gradlew -q :app:processReleaseMainManifest) && python3 scripts/check-release-manifest.py apps/mobile/build/app/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml && python3 scripts/check-apk-size.py --apk apps/mobile/build/app/outputs/flutter-apk/app-debug.apk --budget apps/mobile/apk-size-budget.json && python3 scripts/check-16kb-pages.py --apk apps/mobile/build/app/outputs/flutter-apk/app-debug.apk"
format: "cd apps/mobile && dart format lib test tool"
format_file: ""
# Merge PR (ADR-0013/0014/0015): L1 = người merge mọi PR. AGENTS.md của repo: "auto-merge không bật ở repo này" nên chọn mức chặt nhất;
# PR Dependabot patch/minor theo docs/ops/dependency-updates.md vẫn do phiên merge sau khi người xác nhận câu hỏi của guard.
merge_autonomy: L1
merge_risk_paths: ""
# Tuỳ chọn, agent đọc và chạy trực tiếp (dev-task không chạy)
e2e: ""
audit: ""

# X-Scanner giữ quyền riêng khi cập nhật X-Templates; không thêm allow Bash trùm.
harness_permissions: own

# Khoá mới của khung (bản 3.29.0 (3a3c1010e59690fa474f594a34b25ecc0756dd40)) — bật bằng cách bỏ "# "; vắng khoá = hành vi cũ
# setup: ""             # cài phụ thuộc trước mỗi job CI (npm ci · pip install …); trống = bỏ qua
# format_check: ""      # sàn M/L: kiểm format không ghi file, đỏ khi lệch
# coverage: ""          # sàn M/L: test có ngưỡng coverage; artefact ra mktemp, không `|| true`
# commit_gate: fast
# test_fast: ""         # test liên quan file đổi (XT_CHANGED_FILES, mỗi dòng một file); trống → test
# merge_hard_exceptions: auto
# delivery_phase: build
# e2e_setup: ""         # trước e2e: cài trình duyệt (vd npx playwright install --with-deps chromium)
# e2e_affected: ""      # chỉ spec của lát đang làm (Gate mỗi task); trống = e2e
# attack: ""            # tấn công thử: DAST (ZAP baseline/API scan) · fuzz API (schemathesis run …) trên bản chạy cục bộ/staging
# perf: ""              # kiểm tải có ngưỡng, đỏ khi vượt ngân sách (vd k6 run với thresholds)
# preview: ""           # cách chạy thử bản trình người duyệt (`xt.py stage submit` ghi lại — ADR-0058); vd npm run preview
# preview_smoke: ""     # Gate bản trình: `stage submit` chạy (qua guard), exit ≠ 0 → không trình (D-247); vd npm run build && npx playwright test smoke
# claude_min_version: ""   # doctor cảnh báo khi Claude Code thấp hơn (LOOP-HARNESS-026)
# ai_attribution: ""    # forbid = guard chặn commit/PR ghi tên model hay URL phiên AI (LOOP-HARNESS-027)
# pr_title_check: ""    # off = không đòi tiêu đề PR `<type>(scope): mô tả` ≤ 72 ký tự
