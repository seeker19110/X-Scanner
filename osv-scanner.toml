# EXC-OSV-1 (2026-10-24): AGP 9.1.0 pins these in its internal Unified Test Platform configurations
# (_internal-unified-test-platform-*), listed in gradle.lockfile only because every configuration is locked.
# They run only for connected-device instrumentation tests on a developer host, which the gate and CI never
# run, and are not packaged in the APK. Fixed versions arrive with an AGP update (Dependabot gradle).
# approved_by: AI session under CLAUDE.md §2 delegation, 2026-10-24; owner to confirm. Expires in 90 days.

