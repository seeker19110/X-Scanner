name: "💡 Feature research"
description: Nghiên cứu và đặc tả trước implementation
title: "research: "
labels: ["type: feature", "status: discovery"]
body:
  - type: markdown
    attributes:
      value: "Không code trước khi docs/specs/* được Approved for implementation."
  - type: textarea
    id: problem
    attributes: {label: Problem, user và evidence}
    validations: {required: true}
  - type: textarea
    id: outcome
    attributes: {label: Baseline, target và guardrails}
    validations: {required: true}
  - type: textarea
    id: research
    attributes: {label: Kế hoạch research code/data/user/source}
    validations: {required: true}
  - type: textarea
    id: options
    attributes: {label: Alternatives kể cả không làm}
    validations: {required: true}
  - type: textarea
    id: unknowns
    attributes: {label: Assumptions, unknowns và decisions cần chốt}
    validations: {required: true}
  - type: checkboxes
    id: gate
    attributes:
      label: Spec gate
      options:
        - label: Chưa sửa source trước khi research hoàn tất.
          required: true
        - label: Sẽ tạo docs/specs/YYYY-MM-DD-slug.md từ canonical template.
          required: true
        - label: Chỉ code sau Approved, approver và date.
          required: true
  - type: checkboxes
    id: ready
    attributes:
      label: Definition of Ready (tick khi đủ; chưa đủ thì hỏi, chưa code)
      description: "Chủ repo gán nhãn ready chỉ khi mọi mục đã tick. Agent kiểm danh sách này ở đầu task."
      options:
        - label: Tiêu chí chấp nhận đo được, có ID (AC-xx / S-NNN), gồm ca biên và ca lỗi.
        - label: Không còn câu hỏi mở quan trọng; câu hỏi đã đóng ghi D-NNN hoặc tên người + ngày.
        - label: Phụ thuộc (spec/ADR/dependency/thiết bị) đã xác định và sẵn sàng.
        - label: Luồng/thiết kế đủ rõ; UI có wireframe hoặc ảnh chụp tham chiếu, đủ trạng thái tải/rỗng/lỗi.
        - label: Phạm vi gói trong một PR (nếu không, đã chia lát và ghi số PR).
        - label: Dữ liệu và quyền riêng tư đã xét (docs/privacy/data-map.yaml, docs/THREAT-MODEL.md cần cập nhật không).
