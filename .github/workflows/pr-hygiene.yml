name: PR hygiene

# Conventional PR title and commits, PR body sections and Work ID, fix PR changes a test
# (BASE-REPO-005, STD-PROC-004, WF-REVIEW-002, QA-STRAT-005, FE-TEST-006): scripts/check-pr-policy.py.
# Not a required check: making it required needs a repository admin (docs/ops/x-scanner-repository-guards.md).
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-policy:
    name: PR title, body and fix-test policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check PR policy
        shell: bash
        env:   # untrusted PR text goes through env and files, never into the script source
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/body.md"
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/files.txt"
          git log --format=%s "$BASE_SHA..$HEAD_SHA" > "$RUNNER_TEMP/commits.txt"
          python3 scripts/check-pr-policy.py --title "$PR_TITLE" --body-file "$RUNNER_TEMP/body.md" \
            --changed-files "$RUNNER_TEMP/files.txt" --commits "$RUNNER_TEMP/commits.txt" --author "$PR_AUTHOR"
