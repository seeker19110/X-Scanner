name: Adopt projects-template

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adopt-projects-template.yml'
      - 'scripts/apply-projects-template.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x-scanner-framework-adoption
  cancel-in-progress: false

jobs:
  adopt:
    if: github.repository == 'seeker19110/X-Scanner' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout destination
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Inspect adoption state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f docs/framework/FRAMEWORK-VERSION ]]; then
            echo 'installed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'installed=false' >> "$GITHUB_OUTPUT"
          fi
          command -v python3
          command -v jq
          command -v git
      - name: Fetch pinned template and apply official copy script
        if: steps.state.outputs.installed == 'false'
        env:
          TEMPLATE_SHA: aab9f887ec4acc4480da852cc300978979087f6b
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/projects-template"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/seeker19110/projects-template.git
          git -C "$source_dir" fetch --depth 1 origin "$TEMPLATE_SHA"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$TEMPLATE_SHA"
          # Preserve the source's developer-doc lookup contract, not application cloud processing.
          # The corrected importer is committed with the adopted files. No test is disabled.
          python3 - <<'PY'
          import ast
          from pathlib import Path
          path = Path('scripts/apply-projects-template.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "for rel in ('.nvmrc', '.mcp.json', '.codex/config.toml'):": "for rel in ('.nvmrc', '.codex/config.toml'):",
              "('model', 'fallbackModel', 'effortLevel', 'env', 'enabledMcpjsonServers')": "('model', 'fallbackModel', 'effortLevel', 'env')",
              "    settings['permissions']['allow'] = [entry for entry in settings['permissions']['allow'] if entry != 'mcp__context7']": "    # Preserve upstream Context7 permission for developer documentation only.",
              "Inherit a live model from the operator's configured provider; no paid API or external MCP is mandatory.": "Inherit a live model from the operator's provider; no paid API is required. Context7 is for developer docs only; never send scans or OCR.",
              "model/context 500k mặc định hoặc MCP ngoài.": "model/context 500k mặc định; giữ Context7 của khung chỉ để tra tài liệu phát triển.",
              "self.assertFalse((ROOT / '.mcp.json').exists())": "self.assertTrue((ROOT / '.mcp.json').exists())",
          }
          for before, after in replacements.items():
              if before in text:
                  if text.count(before) != 1:
                      raise RuntimeError(f'Ambiguous integration patch: {before}')
                  text = text.replace(before, after)
              elif after not in text:
                  raise RuntimeError(f'Unexpected importer content: {before}')
          anchor = "        self.assertIn('N/A', (ROOT / 'PROJECT.md').read_text(encoding='utf-8'))"
          marker = 'Configure real product gates before adding application source'
          if marker not in text:
              if text.count(anchor) != 1:
                  raise RuntimeError('Cannot install the product-gate guard')
              text = text.replace(anchor, anchor + "\n        for directory in ('apps', 'packages', 'android', 'ios'):\n            self.assertFalse((ROOT / directory).exists(), 'Configure real product gates before adding application source')")
          ast.parse(text)
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/apply-projects-template.py --source "$source_dir" --target "$GITHUB_WORKSPACE"
          git switch -c "chore/template-adoption-${GITHUB_RUN_ID}"
          git add --all
          git add -f .claude/project-commands.sh
      - name: Verify real repository checks and upstream safety hooks
        if: steps.state.outputs.installed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config core.hooksPath scripts/githooks
          bash scripts/dev-task.sh doctor
          bash scripts/dev-task.sh gate
      - name: Record evidence and commit adopted files
        if: steps.state.outputs.installed == 'false'
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          url = os.environ['RUN_URL']
          text = f'''# Framework adoption verification

          Run: {url}
          Source: seeker19110/projects-template @ aab9f887ec4acc4480da852cc300978979087f6b

          The preceding workflow step completed successfully:
          - scripts/dev-task.sh doctor
          - scripts/dev-task.sh gate
          - syntax/JSON checks in scripts/check-adoption.py --lint
          - seven adoption regression tests in scripts/check-adoption.py
          - upstream scripts/test-hooks-gate.sh and scripts/test-hooks-gate-guard.sh

          Initial run detected a mismatch with the upstream Context7 configuration contract.
          The developer-documentation MCP configuration was preserved and the original tests rerun;
          no upstream safety test was disabled. Real documents and OCR must never be sent to Context7.

          Scope: repository/framework adoption only. Product build/typecheck are explicitly N/A.
          No mobile build, scan, OCR, depth benchmark, release, security certification or
          repository branch-protection verification is claimed. See the run for exact output.
          '''
          Path('docs/adoption/VERIFICATION.md').write_text(text, encoding='utf-8')
          with Path('PROGRESS.md').open('a', encoding='utf-8') as out:
              out.write(f'\n## Bằng chứng bộ khung\n\nDoctor/gate đã chạy thành công: {url}\nChỉ xác nhận repository/framework, không xác nhận app.\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git add -f .claude/project-commands.sh
          git commit -m 'chore: adopt projects-template for X-Scanner with verified repository gates'
          git push origin HEAD:main
          echo 'Framework adoption committed; app implementation remains unstarted.' >> "$GITHUB_STEP_SUMMARY"
